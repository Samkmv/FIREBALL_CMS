# Replace hostname, paths, PHP-FPM socket and TLS configuration.
server {
    listen 80;
    server_name cms.example.com;
    root /srv/fireball/public;
    index index.php;
    client_max_body_size 55m;

    location ~ /\. { deny all; }
    location ~* ^/(?:uploads|assets)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh|sql|bak|env)$ { deny all; }
    location ~ ^/themes/ { rewrite ^/(themes/.+)$ /theme-asset.php?path=$1 last; }
    location = /manifest.webmanifest { rewrite ^ /index.php last; }
    location = /service-worker.js { rewrite ^ /index.php last; }
    location = /sw.js { rewrite ^ /index.php last; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(?:index|theme-asset)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location ~* \.(?:php[0-9]?|phtml|phar)$ { return 404; }
}
