# Replace the hostname, paths and TLS configuration for your server.
<VirtualHost *:80>
    ServerName cms.example.com
    DocumentRoot /srv/fireball/public
    <Directory /srv/fireball>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /srv/fireball/public>
        Options -Indexes -MultiViews
        AllowOverride FileInfo Options
        Require all granted
    </Directory>
    <Directory /srv/fireball/public/uploads>
        AllowOverride None
        Options -Indexes
        <FilesMatch "\.(php[0-9]?|phtml|phar|cgi|pl|py|sh|sql|bak|env)$">
            Require all denied
        </FilesMatch>
    </Directory>
    # Configure PHP-FPM and HTTPS using your distribution's supported settings.
</VirtualHost>
