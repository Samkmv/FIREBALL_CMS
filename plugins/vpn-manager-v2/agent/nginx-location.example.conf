# Place inside an existing HTTPS server block with a trusted certificate.
# Replace the documentation IP with the actual outbound IP of the CMS.
location /fireball-xray/ {
    allow 203.0.113.10;
    deny all;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 95s;
    proxy_pass http://127.0.0.1:9085/;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
}
